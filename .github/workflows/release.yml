name: Release

# 推送 v* 标签：构建通用二进制 → Developer ID 签名 → 公证 → staple → 发布 GitHub Release（附 DMG、ZIP、SHA256）。
# 版本号带 "-"（如 v0.3.0-beta.1）时发布为预发布。
# 发布新版本：./scripts/new-version.sh 0.3.0（修改版本号、提交、打标签并推送）
# 手动触发（workflow_dispatch）只构建并上传 Actions artifact，不创建 Release。
#
# 需要的 Secrets（见 scripts/setup-release-secrets.sh）：
#   APPLE_CERTIFICATE（Developer ID Application .p12 的 base64）、APPLE_CERTIFICATE_PASSWORD、
#   APPLE_SIGNING_IDENTITY、APPLE_ID、APPLE_PASSWORD（App 专用密码）、APPLE_TEAM_ID
# 发布到 CDN（cdn.spotcat.ai，App 内更新读取这里的 latest.json）另需：
#   CLOUDFLARE_ACCOUNT_ID、R2_ACCESS_KEY_ID、R2_SECRET_ACCESS_KEY（仅限 spotcat 桶的 R2 读写令牌）

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        if: github.event_name == 'push'
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $VERSION" >&2
            exit 1
          fi

      - name: Check signing secrets
        id: secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::Signing secrets are not configured (see scripts/setup-release-secrets.sh); skipping. Release locally with ./scripts/release.sh --publish."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        if: steps.secrets.outputs.ready == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

      - name: Build, sign, notarize
        if: steps.secrets.outputs.ready == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh ${{ github.event_name == 'push' && '--publish' || '' }}

      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: Spotcat-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  # GitHub Release 发布之后再同步到 R2：安装包先上传，latest.json 最后替换
  publish-cdn:
    needs: release
    if: github.event_name == 'push' && needs.release.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check R2 secrets
        id: r2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ]; then
            echo "::warning::R2 secrets are not configured; the CDN update feed was not published. Run ./scripts/publish-cdn.sh locally."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.r2.outputs.ready == 'true'
        with:
          name: Spotcat-${{ github.ref_name }}
          path: dist

      - name: Upload to R2 and publish latest.json
        if: steps.r2.outputs.ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_MAX_ATTEMPTS: "5"
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-cdn.sh "${GITHUB_REF_NAME#v}"

      - name: Verify public feed
        if: steps.r2.outputs.ready == 'true' && !contains(github.ref_name, '-')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          curl -fsS --retry 8 --retry-all-errors --retry-delay 5 https://cdn.spotcat.ai/latest.json | grep -F "\"version\": \"$VERSION\""
          curl -fsSI --retry 8 --retry-all-errors --retry-delay 5 "https://cdn.spotcat.ai/Spotcat-$VERSION.zip" >/dev/null
