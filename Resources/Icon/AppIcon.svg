<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Spotcat：猫耳轮廓 + 「>」指令符（负空间），科技蓝浅渐变底 -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <polyline points="40,20 66,56 40,92" fill="none" stroke="#000" stroke-width="11" stroke-linejoin="miter" stroke-miterlimit="10"/>
    </mask>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63B0FF"/>
      <stop offset="0.55" stop-color="#3383FF"/>
      <stop offset="1" stop-color="#1F6BFF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <g transform="translate(252 250) scale(5.2)">
    <g mask="url(#cut)">
      <path d="M9 17 L45 40 L91 17 L91 58 C91 74 80 84 64 84 L36 84 C20 84 9 74 9 58 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
